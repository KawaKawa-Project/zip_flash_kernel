name: Sync KernelSU-Next Marble

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone latest upstream
        run: |
          git clone \
            --depth=1 \
            --single-branch \
            --branch main \
            https://github.com/aosp-pablo/KernelSU-Next-marble.git \
            /tmp/upstream

          rm -rf /tmp/upstream/.git

      - name: Replace repository contents
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            /tmp/upstream/ ./

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Sync KernelSU-Next-marble from upstream"
          git push
